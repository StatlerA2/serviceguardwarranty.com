  .panel-homeowners::after {
    background: rgba(15, 32, 56, 0.7);
  }

  /* Hover states */
  .split-panel:hover {
    flex: 1.15;
  }

  .split-panel:hover::before {
    transform: scale(1.05);
    filter: grayscale(0%) brightness(0.55);
  }

  .panel-roofers:hover::after {
    background: rgba(30, 58, 95, 0.55);
  }

  .panel-homeowners:hover::after {
    background: rgba(30, 58, 95, 0.55);
  }

  .panel-homeowners:hover::before {
    transform: scale(1.05);
    filter: grayscale(0%) brightness(0.55);
  }

  /* Center divider */
  .split-divider {
    position: fixed; top: 0; bottom: 0; left: 50%;
    width: 1px; background: rgba(255,255,255,0.1);
    z-index: 50; transform: translateX(-50%);
    pointer-events: none;
  }

  /* Panel content */
  .panel-content {
    position: relative; z-index: 10;
    text-align: center; padding: 20px;
    display: flex; flex-direction: column; align-items: center; height: 360px;
  }

  .panel-icon {
    width: 64px; height: 64px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    transition: 0.5s ease;
  }
  .panel-icon svg {
    width: 28px; height: 28px; stroke: rgba(255,255,255,0.6);
    transition: 0.5s ease;
  }

  .split-panel:hover .panel-icon {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-4px);
  }
  .split-panel:hover .panel-icon svg {
    stroke: #fff;
  }

  .panel-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    font-weight: 800; color: rgba(255,255,255,0.5);
    letter-spacing: -0.02em;
    text-wrap: balance;
    transition: color 0.5s ease, transform 0.5s ease;
    margin-bottom: 12px;
  }
  .split-panel:hover .panel-title {
    color: #fff;
    transform: translateY(-2px);
  }

  .panel-subtitle {
    font-size: 1rem; color: rgba(255,255,255,0.25);
    max-width: 280px; margin: 0 auto;
    line-height: 1.6;
    transition: color 0.5s ease;
  }
  .split-panel:hover .panel-subtitle {
    color: rgba(255,255,255,0.55);
  }

  .panel-buttons { margin-top: auto; }

  .panel-arrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px; border-radius: 10px;
