<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Guard — Workmanship Warranties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  /* ===== Service Guard theme: bold condensed headings, square edges, navy + blue ===== */
  :root {
    --ink: #0C121D;
    --navy-deep: #0F2038;
    --accent: #2B6CB0;
    --accent-dark: #1F5592;
    --accent-light: #6FA8DC;
    --head: 'Anton', 'Impact', sans-serif;
    --body: 'Source Sans 3', 'Source Sans Pro', sans-serif;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--body);
    height: 100vh; overflow: hidden;
    background: var(--ink);
  }

  /* Split container */
  .split-container { display: flex; height: 100vh; width: 100%; }

  .split-panel {
    flex: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden;
    transition: flex 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .split-panel::before {
    content: ''; position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s ease;
  }
  .split-panel::after {
    content: ''; position: absolute; inset: 0;
    transition: background 0.5s ease;
  }

  .panel-roofers::before {
    background: url('bg-roofers-hero.jpg') center/cover no-repeat;
    filter: grayscale(60%) brightness(0.55);
  }
  .panel-homeowners::before {
    background: url('bg-homeowners-hero.jpg') center/cover no-repeat;
    filter: grayscale(60%) brightness(0.55);
  }
  .panel-roofers::after, .panel-homeowners::after {
    background: linear-gradient(180deg, rgba(12,18,29,0.55) 0%, rgba(15,32,56,0.82) 100%);
  }

  .split-panel:hover { flex: 1.15; }
  .split-panel:hover::before { transform: scale(1.05); filter: grayscale(0%) brightness(0.65); }
  .split-panel:hover::after { background: linear-gradient(180deg, rgba(12,18,29,0.35) 0%, rgba(15,32,56,0.7) 100%); }

  /* Accent bar along the bottom of the hovered panel */
  .split-panel .panel-content::after {
    content: ''; position: absolute; left: 50%; bottom: -40px; transform: translateX(-50%);
    width: 0; height: 4px; background: var(--accent-light);
    transition: width 0.5s ease;
  }
  .split-panel:hover .panel-content::after { width: 80px; }

  .split-divider {
    position: fixed; top: 0; bottom: 0; left: 50%;
    width: 4px; background: var(--accent);
    z-index: 50; transform: translateX(-50%);
    pointer-events: none;
  }

  .panel-content {
    position: relative; z-index: 10;
    text-align: center; padding: 20px;
    display: flex; flex-direction: column; align-items: center; height: 380px;
  }

  .panel-icon {
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 26px;
    border: 1.5px solid rgba(255,255,255,0.45);
    transition: 0.5s ease;
  }
  .panel-icon svg { width: 28px; height: 28px; stroke: rgba(255,255,255,0.85); transition: 0.5s ease; }
  .split-panel:hover .panel-icon { background: var(--accent); border-color: var(--accent); transform: translateY(-4px); }
  .split-panel:hover .panel-icon svg { stroke: #fff; }

  .panel-title {
    font-family: var(--head);
    font-size: clamp(2.6rem, 5vw, 4.4rem);
    font-weight: 400; line-height: 1;
    text-transform: uppercase;
    color: rgba(255,255,255,0.88);
    text-wrap: balance;
    transition: color 0.5s ease, transform 0.5s ease;
    margin-bottom: 16px;
  }
  .split-panel:hover .panel-title { color: #fff; transform: translateY(-2px); }

  .panel-subtitle {
    font-size: 1.1rem; color: rgba(255,255,255,0.7);
    max-width: 320px; margin: 0 auto;
    line-height: 1.6;
    transition: color 0.5s ease;
  }
  .split-panel:hover .panel-subtitle { color: rgba(255,255,255,0.92); }

  .panel-buttons {
    margin-top: auto;
    display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px;
  }

  /* Secondary: white outline */
  .panel-arrow {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 0 30px;
    font-family: var(--body); font-weight: 600; font-size: 0.85rem;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.85);
    background: transparent;
    transition: 0.3s ease;
    text-decoration: none;
    position: relative; z-index: 20;
  }
  .panel-arrow:hover { background: #fff; color: var(--ink); }

  /* Primary: solid accent */
  .panel-claim {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 0 30px;
    font-family: var(--body); font-weight: 600; font-size: 0.85rem;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: #fff;
    border: 1.5px solid var(--accent);
    background: var(--accent);
    transition: 0.3s ease;
    text-decoration: none;
    position: relative; z-index: 20;
  }
  .panel-claim svg { width: 14px; height: 14px; transition: transform 0.3s ease; }
  .panel-claim:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .panel-claim:hover svg { transform: translateX(3px); }

  .landing-logo-wrap {
    position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    background: var(--ink);
    padding: 14px 22px;
    border-bottom: 4px solid var(--accent);
  }

  .landing-footer {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    text-align: center; white-space: nowrap;
  }

  @media (max-width: 768px) {
    .split-container { flex-direction: column; }
    .split-divider { top: 50%; bottom: auto; left: 0; right: 0; width: 100%; height: 4px; transform: translateY(-50%); }
    .split-panel:hover { flex: 1.3; }
    .panel-content { height: auto; gap: 0; }
    .panel-buttons { margin-top: 22px; }
    .panel-icon { margin-bottom: 16px; }
  }
  @media (max-width: 600px) {
    .landing-logo-wrap { display: none; }
    .panel-subtitle { white-space: normal !important; overflow-wrap: break-word; }
    body { overflow-x: hidden; }
    .panel-title { font-size: 2.4rem; }
  }
</style>
</head>
<body>

<!-- Logo -->
<div class="landing-logo-wrap">
  <img src="logo-stacked.png" alt="Service Guard" style="height:90px;width:auto;display:block;filter:brightness(0) invert(1);opacity:0.9;">
</div>


<!-- Split panels -->
<div class="split-container">

  <!-- Left: For Roofers -->
  <div class="split-panel panel-roofers" onclick="window.location='roofers.html'" style="cursor:pointer;">
    <div class="panel-content">
      <div class="panel-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div class="panel-title">For Roofers</div>
      <div class="panel-subtitle" style="max-width:400px;">Insurance-backed workmanship warranties<br>that help you win more jobs</div>
      <div class="panel-buttons">
        <a href="roofers.html" class="panel-arrow" onclick="event.stopPropagation();">Home Page</a>
        <a href="contact.html" class="panel-claim" onclick="event.stopPropagation();">
          Get In Touch
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Right: For Homeowners -->
  <div class="split-panel panel-homeowners" onclick="window.location='homeowners.html'" style="cursor:pointer;">
    <div class="panel-content">
      <div class="panel-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div class="panel-title">For Homeowners</div>
      <div class="panel-subtitle" style="max-width:none;white-space:nowrap;">Understand your coverage or file a claim</div>
      <div class="panel-buttons">
        <a href="homeowners.html" class="panel-arrow" onclick="event.stopPropagation();">Home Page</a>
        <a href="claim.html" class="panel-claim" onclick="event.stopPropagation();">
          File a Claim
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

</div>

<div class="landing-footer">© 2026 Service Guard &nbsp;·&nbsp; Workmanship Warranties</div>

</body>
</html>
